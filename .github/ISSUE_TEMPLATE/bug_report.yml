name: Bug report
description: Report a reproducible Scene Archivist problem
body:
  - type: input
    id: versions
    attributes:
      label: Scene Archivist and SillyTavern versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Use an invented example. Describe the action, actual result and expected result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics, optional
      description: Use Export reviewed diagnostics, read the preview, and remove anything private. Do not include credentials, proxy URLs or private story text.
